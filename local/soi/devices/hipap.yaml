    SensorID_WHISKEY:
      units: "ID"
      description: "Unknown sensor ID from example for WHISKEY"
    SensorValue_WHISKEY:
      description: "Unknown sensor value from example for WHISKEY"
    SystemID_WHISKEY:
      units: "ID"
      description: "Unknown system ID from example for WHISKEY"

    # PSIMSNS_HOTEL Fields
