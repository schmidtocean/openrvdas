    # PSIMSSB_ZULU Fields
    GPSTime_ZULU:
      units: "UTC"
      description: "Coordinated Universal Time (hhmmss.ss) for ZULU"
    Status_ZULU:
      units: "code"
      description: "Measurement status for ZULU: A for OK, V for not OK"
    ErrorCode_ZULU:
      units: "code"
      description: "Three-character error code for ZULU if status is V"
    CoordSys_ZULU:
      units: "code"
      description: "Coordinate system for ZULU: C=Cartesian, P=Polar, U=UTM"
    Orientation_ZULU:
      units: "code"
      description: "Coordinate orientation for ZULU: H=Vessel Head Up, N=North, E=East"
    SWFilter_ZULU:
      units: "code"
      description: "Software filter status for ZULU: M=Measured, F=Filtered, P=Predicted"
    X_coord_ZULU:
      units: "meters or degrees"
      description: "X coordinate for ZULU (e.g., Starboard, North, Eastings)"
    Y_coord_ZULU:
      units: "meters or degrees"
      description: "Y coordinate for ZULU (e.g., Forwards, East, Northings)"
    Depth_ZULU:
      units: "meters"
      description: "Depth of beacon in meters for ZULU"
    Accuracy_ZULU:
      units: "meters"
      description: "Expected accuracy of the position for ZULU"
    AddlInfo_ZULU:
      units: "code"
      description: "Additional information for ZULU: N=None, C=Compass, I=Inclinometer"
    AddlVal1_ZULU:
      description: "First additional value for ZULU (e.g., Tp compass or Tp x inclination)"
    AddlVal2_ZULU:
      description: "Second additional value for ZULU (e.g., Tp y inclination)"
    Val4_ZULU:
      description: "Additional ordinal value 4 for ZULU"
    Val5_ZULU:
      description: "Additional ordinal value 5 for ZULU"

