################################################################################
# HiPAP Device Type definitions
#
# See README.md in this directory

######################################
HiPAP:
  category: "device_type"

  format:
    # Handles SSBL position telegrams
    # Example: $PSIMSSB,164710.938,M01,A,,C,N,M,-29.656,-19.177,158.877,0.185,T,0.100151,
    # Local coord format
    # Example: $PSIMSSB,164736.202,M01,A,,C,N,M,-29.681,-19.123,58.876,0.185,T,0.100151,
    # - "$PSIMSSB,{GPSTime:f},{BeaconID:w},{Status:w},{ErrorCode:ow},{CoordSys:w},{Orientation:w},{SWFilter:w},{X_coord:nlat},{Y_coord:nlat},{Depth:f},{Accuracy:f},{AddlInfo:w},{AddlVal1:of},{AddlVal2:of},"
    # - "$PSIMSSB,{GPSTime:f},{BeaconID:w},{Status:w},{ErrorCode:ow},{CoordSys:w},{Orientation:w},{SWFilter:w},{X_coord:nlat},{Y_coord:nlat},{Depth:f},{Accuracy:f},{AddlInfo:w},{AddlVal1:of},"
    # Geographic coord format
    # Example: $PSIMSSB,130248.934,M01,A,,D,N,M,3641.63178,S,07305.80905,W,458.876,0.185,N,,
    # - "$PSIMSSB,{GPSTime:f},{BeaconID:w},{Status:w},{ErrorCode:ow},{CoordSys:w},{Orientation:w},{SWFilter:w},{X_coord:nlat_dir},{Y_coord:nlat_dir},{Depth:f},{Accuracy:f},{AddlInfo:w},{AddlVal1:of},{AddlVal2:of},"
    # - "$PSIMSSB,{GPSTime:f},{BeaconID:w},{Status:w},{ErrorCode:ow},{CoordSys:w},{Orientation:w},{SWFilter:w},{X_coord:nlat_dir},{Y_coord:nlat_dir},{Depth:f},{Accuracy:f},{AddlInfo:w},{AddlVal1:of},"
    PSIMSSB_ZULU:
    - "$PSIMSSB,{GPSTime_ZULU:f},M08,{Status_ZULU:w},{ErrorCode_ZULU:ow},{CoordSys_ZULU:w},{Orientation_ZULU:w},{SWFilter_ZULU:w},{X_coord_ZULU:nlat_dir},{Y_coord_ZULU:nlat_dir},{Depth_ZULU:f},{Accuracy_ZULU:f},{AddlInfo_ZULU:w},{AddlVal1_ZULU:of},{AddlVal2_ZULU:of},,{Val4_ZULU:od},{Val5_ZULU:od}"
    - "$PSIMSSB,{GPSTime_ZULU:f},M08,{Status_ZULU:w},{ErrorCode_ZULU:ow},{CoordSys_ZULU:w},{Orientation_ZULU:w},{SWFilter_ZULU:w},{X_coord_ZULU:nlat_dir},{Y_coord_ZULU:nlat_dir},{Depth_ZULU:f},{Accuracy_ZULU:f},{AddlInfo_ZULU:w},{AddlVal1_ZULU:of},{AddlVal2_ZULU:of}"
    PSIMSSB_ZULU_FSK:
    - "$PSIMSSB,{GPSTime_ZULU:f},B16,{Status_ZULU:w},{ErrorCode_ZULU:ow},{CoordSys_ZULU:w},{Orientation_ZULU:w},{SWFilter_ZULU:w},{X_coord_ZULU:nlat_dir},{Y_coord_ZULU:nlat_dir},{Depth_ZULU:f},{Accuracy_ZULU:f},{AddlInfo_ZULU:w},{AddlVal1_ZULU:of},{AddlVal2_ZULU:of},,{Val4_ZULU:od},{Val5_ZULU:od}"
    - "$PSIMSSB,{GPSTime_ZULU:f},B16,{Status_ZULU:w},{ErrorCode_ZULU:ow},{CoordSys_ZULU:w},{Orientation_ZULU:w},{SWFilter_ZULU:w},{X_coord_ZULU:nlat_dir},{Y_coord_ZULU:nlat_dir},{Depth_ZULU:f},{Accuracy_ZULU:f},{AddlInfo_ZULU:w},{AddlVal1_ZULU:of},{AddlVal2_ZULU:of}"
    #PSIMSSB_YANKEE: "$PSIMSSB,{GPSTime_YANKEE:f},M01,{Status_YANKEE:w},{ErrorCode_YANKEE:ow},{CoordSys_YANKEE:w},{Orientation_YANKEE:w},{SWFilter_YANKEE:w},{X_coord_YANKEE:nlat_dir},{Y_coord_YANKEE:nlat_dir},{Depth_YANKEE:f},{Accuracy_YANKEE:f},{AddlInfo_YANKEE:w},{AddlVal1_YANKEE:of},{AddlVal2_YANKEE:of},,{Val4_YANKEE:od},{Val5_YANKEE:od}"
    #PSIMSSB_YANKEE: "$PSIMSSB,{GPSTime_YANKEE:f},BXX,{Status_YANKEE:w},{ErrorCode_YANKEE:ow},{CoordSys_YANKEE:w},{Orientation_YANKEE:w},{SWFilter_YANKEE:w},{X_coord_YANKEE:nlat_dir},{Y_coord_YANKEE:nlat_dir},{Depth_YANKEE:f},{Accuracy_YANKEE:f},{AddlInfo_YANKEE:w},{AddlVal1_YANKEE:of},{AddlVal2_YANKEE:of},,{Val4_YANKEE:od},{Val5_YANKEE:od}"
    PSIMSSB_WHISKEY:
    - "$PSIMSSB,{GPSTime_WHISKEY:f},M05,{Status_WHISKEY:w},{ErrorCode_WHISKEY:ow},{CoordSys_WHISKEY:w},{Orientation_WHISKEY:w},{SWFilter_WHISKEY:w},{X_coord_WHISKEY:nlat_dir},{Y_coord_WHISKEY:nlat_dir},{Depth_WHISKEY:f},{Accuracy_WHISKEY:f},{AddlInfo_WHISKEY:w},{AddlVal1_WHISKEY:of},{AddlVal2_WHISKEY:of},,{Val4_WHISKEY:od},{Val5_WHISKEY:od}"
    - "$PSIMSSB,{GPSTime_WHISKEY:f},M05,{Status_WHISKEY:w},{ErrorCode_WHISKEY:ow},{CoordSys_WHISKEY:w},{Orientation_WHISKEY:w},{SWFilter_WHISKEY:w},{X_coord_WHISKEY:nlat_dir},{Y_coord_WHISKEY:nlat_dir},{Depth_WHISKEY:f},{Accuracy_WHISKEY:f},{AddlInfo_WHISKEY:w},{AddlVal1_WHISKEY:of},{AddlVal2_WHISKEY:of}"
    PSIMSSB_WHISKEY_FSK:
    - "$PSIMSSB,{GPSTime_WHISKEY:f},B37,{Status_WHISKEY:w},{ErrorCode_WHISKEY:ow},{CoordSys_WHISKEY:w},{Orientation_WHISKEY:w},{SWFilter_WHISKEY:w},{X_coord_WHISKEY:nlat_dir},{Y_coord_WHISKEY:nlat_dir},{Depth_WHISKEY:f},{Accuracy_WHISKEY:f},{AddlInfo_WHISKEY:w},{AddlVal1_WHISKEY:of},{AddlVal2_WHISKEY:of},,{Val4_WHISKEY:od},{Val5_WHISKEY:od}"
    - "$PSIMSSB,{GPSTime_WHISKEY:f},B37,{Status_WHISKEY:w},{ErrorCode_WHISKEY:ow},{CoordSys_WHISKEY:w},{Orientation_WHISKEY:w},{SWFilter_WHISKEY:w},{X_coord_WHISKEY:nlat_dir},{Y_coord_WHISKEY:nlat_dir},{Depth_WHISKEY:f},{Accuracy_WHISKEY:f},{AddlInfo_WHISKEY:w},{AddlVal1_WHISKEY:of},{AddlVal2_WHISKEY:of}"
    PSIMSSB_HOTEL:
    - "$PSIMSSB,{GPSTime_HOTEL:f},B14,{Status_HOTEL:w},{ErrorCode_HOTEL:ow},{CoordSys_HOTEL:w},{Orientation_HOTEL:w},{SWFilter_HOTEL:w},{X_coord_HOTEL:nlat_dir},{Y_coord_HOTEL:nlat_dir},{Depth_HOTEL:f},{Accuracy_HOTEL:f},{AddlInfo_HOTEL:w},{AddlVal1_HOTEL:of},{AddlVal2_HOTEL:of},,{Val4_HOTEL:od},{Val5_HOTEL:od}"
    - "$PSIMSSB,{GPSTime_HOTEL:f},B14,{Status_HOTEL:w},{ErrorCode_HOTEL:ow},{CoordSys_HOTEL:w},{Orientation_HOTEL:w},{SWFilter_HOTEL:w},{X_coord_HOTEL:nlat_dir},{Y_coord_HOTEL:nlat_dir},{Depth_HOTEL:f},{Accuracy_HOTEL:f},{AddlInfo_HOTEL:w},{AddlVal1_HOTEL:of},{AddlVal2_HOTEL:of}"

    # Handles sensor values telegrams for head attitude
    # Example: $PSIMSNS,164711.822,M01,1,1,-0.10,0.18,0.00,20.44,,d1,0.006,,M121
    # Example2:$PSIMSNS,193747.229,,1,1,0.35,-0.20,0.00,16.12,,60,0.000,,M121"
    PSIMSNS_ZULU:
    - "$PSIMSNS,{GPSTime_ZULU:f},M08,{TransducerNum_ZULU:od},{SensorStatus_ZULU:od},{Roll_ZULU:of},{Pitch_ZULU:of},{Heave_ZULU:of},{Heading_ZULU:of},,{SensorID_ZULU:ow},{SensorValue_ZULU:of},,{SystemID_ZULU:ow}{:os}"
    - "$PSIMSNS,{GPSTime_ZULU:f},M08,{TransducerNum_ZULU:od},{SensorStatus_ZULU:od},{Roll_ZULU:of},{Pitch_ZULU:of},{Heave_ZULU:of},{Heading_ZULU:of}{:os}"
    - "$PSIMSNS,{GPSTime_ZULU:f},B16,{TransducerNum_ZULU:od},{SensorStatus_ZULU:od},{Roll_ZULU:of},{Pitch_ZULU:of},{Heave_ZULU:of},{Heading_ZULU:of},,{SensorID_ZULU:ow},{SensorValue_ZULU:of},,{SystemID_ZULU:ow}{:os}"
    - "$PSIMSNS,{GPSTime_ZULU:f},B16,{TransducerNum_ZULU:od},{SensorStatus_ZULU:od},{Roll_ZULU:of},{Pitch_ZULU:of},{Heave_ZULU:of},{Heading_ZULU:of}{:os}"
    PSIMSNS_WHISKEY:
    - "$PSIMSNS,{GPSTime_WHISKEY:f},M05,{TransducerNum_WHISKEY:od},{SensorStatus_WHISKEY:od},{Roll_WHISKEY:of},{Pitch_WHISKEY:of},{Heave_WHISKEY:of},{Heading_WHISKEY:of},,{SensorID_WHISKEY:ow},{SensorValue_WHISKEY:of},,{SystemID_WHISKEY:ow}{:os}"
    - "$PSIMSNS,{GPSTime_WHISKEY:f},M05,{TransducerNum_WHISKEY:od},{SensorStatus_WHISKEY:od},{Roll_WHISKEY:of},{Pitch_WHISKEY:of},{Heave_WHISKEY:of},{Heading_WHISKEY:of}{:os}"
    - "$PSIMSNS,{GPSTime_WHISKEY:f},B37,{TransducerNum_WHISKEY:od},{SensorStatus_WHISKEY:od},{Roll_WHISKEY:of},{Pitch_WHISKEY:of},{Heave_WHISKEY:of},{Heading_WHISKEY:of},,{SensorID_WHISKEY:ow},{SensorValue_WHISKEY:of},,{SystemID_WHISKEY:ow}{:os}"
    - "$PSIMSNS,{GPSTime_WHISKEY:f},B37,{TransducerNum_WHISKEY:od},{SensorStatus_WHISKEY:od},{Roll_WHISKEY:of},{Pitch_WHISKEY:of},{Heave_WHISKEY:of},{Heading_WHISKEY:of}{:os}"
    PSIMSNS_HOTEL:
    - "$PSIMSNS,{GPSTime_HOTEL:f},B14,{TransducerNum_HOTEL:od},{SensorStatus_HOTEL:od},{Roll_HOTEL:of},{Pitch_HOTEL:of},{Heave_HOTEL:of},{Heading_HOTEL:of},,{SensorID_HOTEL:ow},{SensorValue_HOTEL:of},,{SystemID_HOTEL:ow}{:os}"
    - "$PSIMSNS,{GPSTime_HOTEL:f},B14,{TransducerNum_HOTEL:od},{SensorStatus_HOTEL:od},{Roll_HOTEL:of},{Pitch_HOTEL:of},{Heave_HOTEL:of},{Heading_HOTEL:of}{:os}"
    PSIMSNS:
    - "$PSIMSNS,{GPSTime:f},{TransceiverNum:ow},{TransducerNum:od},{SensorStatus:od},{Roll:of},{Pitch:of},{Heave:of},{Heading:of},,{SensorID:ow},{SensorValue:of},,{SystemID:ow}"
    - "$PSIMSNS,{GPSTime:f},,{TransducerNum:od},{SensorStatus:od},{Roll:of},{Pitch:of},{Heave:of},{Heading:of},,{SensorID:ow},{SensorValue:of},,{SystemID:ow}"
    - "$PSIMSNS,{GPSTime:f},{TransceiverNum:ow},{TransducerNum:od},{SensorStatus:od},{Roll:of},{Pitch:of},{Heave:of},{Heading:of}{:os}"
    - "$PSIMSNS,{GPSTime:f},,{TransducerNum:od},{SensorStatus:od},{Roll:of},{Pitch:of},{Heave:of},{Heading:of}{:os}"
  ########
  # Metadata for the parsed values.
  fields:
    # PSIMSNS Fields
    TransceiverNum:
      units: "ID"
      description: "Transceiver number"
    TransducerNum:
      units: "ID"
      description: "Transducer number"
    SensorStatus:
      description: "Unknown sensor status field from example"
    Roll:
      units: "degrees"
      description: "Roll angle in degrees"
    Pitch:
      units: "degrees"
      description: "Pitch angle in degrees"
    Heave:
      units: "meters"
      description: "Heave in meters"
    Heading:
      units: "degrees"
      description: "Heading in degrees (0-360)"
    SensorID:
      units: "ID"
      description: "Unknown sensor ID from example"
    SensorValue:
      description: "Unknown sensor value from example"
    SystemID:
      units: "ID"
      description: "Unknown system ID from example"

    # PSIMSNS_ZULU Fields
    TransducerNum_ZULU:
      units: "ID"
      description: "Transducer number for ZULU"
    SensorStatus_ZULU:
      description: "Unknown sensor status field from example for ZULU"
    Roll_ZULU:
      units: "degrees"
      description: "Roll angle in degrees for ZULU"
    Pitch_ZULU:
      units: "degrees"
      description: "Pitch angle in degrees for ZULU"
    Heave_ZULU:
      units: "meters"
      description: "Heave in meters for ZULU"
    Heading_ZULU:
      units: "degrees"
      description: "Heading in degrees (0-360) for ZULU"
    SensorID_ZULU:
      units: "ID"
      description: "Unknown sensor ID from example for ZULU"
    SensorValue_ZULU:
      description: "Unknown sensor value from example for ZULU"
    SystemID_ZULU:
      units: "ID"
      description: "Unknown system ID from example for ZULU"

    # PSIMSNS_WHISKEY Fields
    TransducerNum_WHISKEY:
      units: "ID"
      description: "Transducer number for WHISKEY"
    SensorStatus_WHISKEY:
      description: "Unknown sensor status field from example for WHISKEY"
    Roll_WHISKEY:
      units: "degrees"
      description: "Roll angle in degrees for WHISKEY"
    Pitch_WHISKEY:
      units: "degrees"
      description: "Pitch angle in degrees for WHISKEY"
    Heave_WHISKEY:
      units: "meters"
