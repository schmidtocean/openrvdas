######################################
Fluorometer:
  category: "device_type"
  description: "Fluorometer"

  # $FLUO,99-99-99,99:99:99,0.88,695,166,530*0F
  #format: "$FLUO,{Date:S},{Time:S},{ChlSig:g},{NU:d},{ChlSigRaw:d},{Therm:d}*{CheckSum:x}"

  #99/99/99 99:99:99 695 159 534
  format:
    NoChlSpace: "{Date:S} {Time:S} {NU:d} {ChlSigRaw:d} {Therm:d}"
    WithChlSpace: "{Date:S} {Time:S} {ChlSig:g} {NU:d} {ChlSigRaw:d} {Therm:d}"
    NoChlTab: "{Date:S}\t{Time:S}\t{NU:d}\t{ChlSigRaw:d}\t{Therm:d}"
    WithChlTab: "{Date:S}\t{Time:S}\t{ChlSig:g}\t{NU:d}\t{ChlSigRaw:d}\t{Therm:d}"

  fields:
    ChlSig:
     units: ""
     description: "Sensor Corrected Chl Signal"
    NU:
      units: ""
      description: "N/U"
    Therm:
      units: ""
      description: "Therm"
    ChlSigRaw:
      units: ""
      description: "Raw Chl Signal"

######################################
MET4:
  category: "device_type"
  description: "Paroscientific MET4"

  # $WIXDR,P,<pres_bar>,B,<pres_SN>,C,<temp_c>,C,<temp_SN>,H,<humidity>,P,<humid_SN>
  # $WIXDR,P,1001.075,hPa,DQ153542,C,.12,C,DQ20408332,H,100.00,P,DQ20408332
  # $WIXDR,P,1012.465,hPa,DQ153542,C,8.98,C,DQ20408332,H,72.56,P,DQ20408332
  # Note airtemp could be expressed as non-leading zero decimal so :g is not applicable

  format: "$WIXDR,P,{AirPres:g},hPa,{:w},C,{AirTemp:f},C,{:w},H,{Humidity:f},P,{:w}"

  fields:
    AirPres:
      units: "hPa"
      description: "Air Pressure"
    AirTemp:
      units: "C"
      description: "Air Temperature"
    Humidity:
      units: "%"
      description: "Hummidity"

######################################
MiniSVS:
  category: "device_type"
  description: "MiniSVS"

  format:
    space: " {SoundVelocity:g}"
    no-space: "{SoundVelocity:g}"

  fields:
    SoundVelocity:
      units: "m/s"
      description: "Sound velocity"

######################################
MiniSVST:
  category: "device_type"
  description: "MiniSVST"

  format: "{Temperature:g} {SoundVelocity:g}"

  fields:
    Temperature:
      units: "C"
      description: "Temperature"
    SoundVelocity:
      units: "m/s"
      description: "Sound velocity"

######################################
ParBiospherical:
  category: "device_type"
  description: "Par - Biospherical Instruments"

  format: "{AnalogChannel:g},{:g},{:g},{Voltage:g}"

  fields:
    AnalogChannel:
      units: ""
      description: "AI on Moxa"
    Voltage:
      units: "v"
      description: "Raw Voltage"

######################################
sunburst_pH:
  category: "device_type"
  description: "sunburst_pH"

  format: 
    measSal2: "$SBSPH,{InstrumentYearDay:g},{Temperature:g},{SalinityConstant:g},{pH_ConstSal:g},{SalinityUsed:g},{pH_MeasSal:g},{BatteryVoltage:g},{InstrumentDate:S},{InstrumentTime:S}"
    measSal: "$SBSPH,{InstrumentYearDay:g},{Temperature:g},{SalinityConstant:g},{pH_ConstSal:g},{pH_MeasSal:g},{BatteryVoltage:g},{InstrumentDate:S},{InstrumentTime:S}"
    constSal: "$SBSPH,{InstrumentYearDay:g},{Temperature:g},{SalinityConstant:g},{pH_ConstSal:g},{BatteryVoltage:g},{InstrumentDate:S},{InstrumentTime:S}"

  fields:
    InstrumentYearDay:
      units: "time"
      description: "Year/Day"
    Temperature:
      units: "C"
      description: "Temperature"
    SalinityConstant:
      units: "PSU"
      description: "SalinityConstant"
    pH_ConstSal:
      units: ""
      description: "pH with constant salinity"
    SalinityUsed:
      units: "PSU"
      description: "Salinity used for salinity correction"
    pH_MeasSal:
      units: ""
      description: "pH corrected with measured salinity"
    BatteryVoltage:
      units: ""
      description: "Battery Voltage"
    InstrumentDate:
      units: "yyyy-mm-dd"
      description: "Instrument date"
    InstrumentTime:
      units: "HH:MM:SS"
      description: "Instrument time"

