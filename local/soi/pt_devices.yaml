################################################################################
# Device definitions for the Participant Devices
# all particpant devices whould start with pt_{devicename} so they are easily identified
# See README.md in this directory

devices:
  ######################################
  pt_whoi_mag:
    category: "device"
    device_type: "mag_aps"
    serial_number: "730"
    description: "deepsea magnetometer"

    fields:
      Mag_X: "PT_WHOI_MAG_X"
      Mag_Y: "PT_WHOI_MAG_Y"
      Mag_Z: "PT_WHOI_MAG_Z"
      Mag_Temperature: "PT_WHOI_MAG_Temperature_C"

  ######################################
  pt_pmel_mapr:
    category: "device"
    device_type: "mapr"
    serial_number: " "
    description: "pmel mapr"

    fields:
      InstrumentTime: "PT_MAPR_Time"
      Temperature: "PT_MAPR_Temperature"
      Pressure: "PT_MAPR_Pressure"
      ORP: "PT_MAPR_ORP"
      LSS: "PT_MAPR_LSS"

  # #######################################
  pt_uaf_oxygen:
    category: "device"
    device_type: "Oxygen"
    serial_number: "unknown"
    description: ""

    fields:
      Concentration: "PT_SB_Oxygen_Concentration"
      Saturation: "PT_SB_Oxygen_Saturation"
      Temperature: "PT_SB_Oxygen_Temperature"
      # Measurement_1: "PT_SB_Oxygen_Measurement_1"
      # Measurement_2: "PT_SB_Oxygen_Measurement_2"
      # CalPhase: "PT_SB_Oxygen_CalPhase"
      # TCPhase: "PT_SB_Oxygen_TCPhase"
      # C1_RPH: "PT_SB_Oxygen_C1_RPH"
      # C2_RPH: "PT_SB_Oxygen_C2_RPH"
      # C1_AMP: "PT_SB_Oxygen_C1_AMP"
      # C2_AMP: "PT_SB_Oxygen_C2_AMP"

  ######################################
  pt_contros_ch4:
    category: "device"
    device_type: "contros_ch4"
    serial_number: ""
    description: ""

    fields:
      P_pump: "PT_CH4_P_Pump"
      p_TDLAS: "PT_CH4_Pres_TDLAS"
      p_in: "PT_CH4_Pres_In"
      I_Total: "PT_CH4_Current"
      U_Supply: "PT_CH4_Voltage_Supply"
      ExternalPump: "PT_CH4_Ext_Pump"
      Runtime: "PT_CH4_Runtime"
      CH4ConcentrationEst: "PT_CH4_Concentration_Est"
      CH4PartialPressure: "PT_CH4_Partial_Pres"
      CH4Fraction: "PT_CH4_Fraction"
      ProbeTemp: "PT_CH4_Probe_Temp"
      GasTemp: "PT_CH4_Gas_Temp"
      RelHumidity: "PT_CH4_Rel_Humidity"


  ######################################
  pt_oxygen_sbe63:
    category: "device"
    device_type: "Oxygen"
    serial_number: "unknown"
    description: "SBE 63 is an individually calibrated, high-accuracy, optical oxygen sensor"

    fields:
      PhaseDelay: "PT_SBE63_PhaseDelay"
      ThermistorVoltage: "PT_SBE63_ThermVoltage"
      DissolvedOxygen: "PT_SBE63_Concentration"
      Temperature: "PT_SBE63_Temperature"