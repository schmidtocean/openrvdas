################################################################################
# Device definitions for the The Childlike Empress devices
# all devices should start with emp_{devicename} so they are easily identified
# See README.md in this directory

devices:
  ######################################
  emp_hugin_rt:
    category: "device"
    device_type: "Hugin"
    serial_number: "2140"
    description: "Kongsberg Hugin Superior AUV"

    fields:
      # PFFILLD Fields (matches PKMSLLD)
      Time: "VehicleTime"
      VehicleClass: "VehicleClass"
      VehicleID: "VehicleID"
      LatitudeDD: "LatitudeDD"
      LatHemi: "LatHemi"
      LongitudeDD: "LongitudeDD"
      LonHemi: "LonHemi"
      Depth: "Depth"
      DepthRef: "DepthRef"
      LatStdDev: "LatStdDev"
      LonStdDev: "LonStdDev"
      DepthStdDev: "DepthStdDev"
      SourceType: "SourceType"

      # PFFIAAV Fields (matches PKMSAAV)
      Heading: "Heading"
      Course: "Course"
      Pitch: "Pitch"
      Roll: "Roll"
      Altitude: "Altitude"
      FwdVel: "FwdVel"
      StbVel: "StbVel"

      # PFFICSR Fields (matches PKMSCSR)
      MissionLine: "MissionLine"
      AltRef: "AltRef"
      DepthMode: "DepthMode"
      SpeedRef: "SpeedRef"
      SpeedMode: "SpeedMode"
      CourseRef: "CourseRef"
      GuidanceMode: "GuidanceMode"
      RemDuration: "RemDuration"
      RemDistance: "RemDistance"
      MissionState: "MissionState"
      PayloadStatus: "PayloadStatus"

      # PFFIWPT Fields (matches PKMSWPT)
      OrigLat: "OrigLat"
      OrigLatHemi: "OrigLatHemi"
      OrigLon: "OrigLon"
      OrigLonHemi: "OrigLonHemi"
      DestLat: "DestLat"
      DestLatHemi: "DestLatHemi"
      DestLon: "DestLon"
      DestLonHemi: "DestLonHemi"
      XTrackOffset: "XTrackOffset"

      # PFFISUP Fields (matches PKMSSUP)
      AUVStatus: "AUVStatus"
      MasterTriggerMode: "MasterTriggerMode"
      TriggerRateDist: "TriggerRateDist"
      SecondaryTriggerRate: "SecondaryTriggerRate"
      Voltage: "Voltage"
      BatteryLife: "BatteryLife"

      # PFFITSI Fields (matches PKMSTSI)
      HuginOS_Ver: "HuginOS_Ver"
      HuginOS_Mode: "HuginOS_Mode"
      HiPAP_Age: "HiPAP_Age"
      ACL_Age: "ACL_Age"
      ADL_Age: "ADL_Age"
      RF_Age: "RF_Age"
      Sat_Age: "Sat_Age"
      Svc_Age: "Svc_Age"
      UTM_Zone: "UTM_Zone"
      RemMissionTime: "RemMissionVehicleTime"

      # NMEA IN GGA Fields
      GPSTime: "GPSTime"
      FixQuality: "FixQuality"
      NumSats: "NumSats"
      HDOP: "HDOP"
      AntennaHeight: "AntennaHeight"
      GeoidHeight: "GeoidHeight"
      LastDGPSUpdate: "LastDGPSUpdate"
      DGPSStationID: "DGPSStationID"
      CheckSum: "CheckSum"

      # NMEA IN GST Fields
      RMS: "RMS"
      SemiMajorStd: "SemiMajorStd"
      SemiMinorStd: "SemiMinorStd"
      Orientation: "Orientation"
      LatitudeStd: "LatitudeStd"
      LongitudeStd: "LongitudeStd"
      AltitudeStd: "AltitudeStd"

      # NMEA IN HDT Fields
      HeadingTrue: "HeadingTrue"

      # Derived vars
      Latitude: "Latitude"
      Longitude: "Longitude"