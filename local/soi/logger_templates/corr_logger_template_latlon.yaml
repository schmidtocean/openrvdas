# ---------------------------------------------------------------------------
# Template: corr_logger_template_latlon
#
# Description:
#   Defines a logger that subscribes to raw latitude/longitude
#   and their corresponding hemisphere fields (N/S/E/W).
#   It uses latlon_transform to create new signed decimal degree
#   fields for latitude and longitude.
#
# Required Logger Variables:
#   - raw_lat_field:        (string) Raw latitude field (e.li., "Latitude")
#   - raw_lat_hemi_field:   (string) Raw latitude hemisphere field (e.g., "LatHemi")
#   - raw_lon_field:        (string) Raw longitude field (e.g., "Longitude")
#   - raw_lon_hemi_field:   (string) Raw longitude hemisphere field (e.g., "LonHemi")
#   - derived_lat_field:    (string) Name for the new signed latitude field (e.g., "Latitude_signed")
#   - derived_lon_field:    (string) Name for the new signed longitude field (e.g., "Longitude_signed")
#   - measurement_name:     (string) Measurement name for InfluxDB writers
#
# ---------------------------------------------------------------------------
logger_templates:
  corr_logger_template_latlon:

    # Common base defining the core read/transform logic
    # Its output is structured data with the new derived fields
    base: &base
      readers:
      - class: CachedDataReader
        kwargs:
          data_server: <<cdw_port>>
          subscription:
            fields:
              <<raw_lat_field>>:
                seconds: 0
              <<raw_lat_hemi_field>>:
                seconds: 0
              <<raw_lon_field>>:
                seconds: 0
              <<raw_lon_hemi_field>>:
                seconds: 0
      transforms:
      - class: LatLonTransform
        # This path must match where you saved the .py file
        module: contrib.soi.logger.transforms.latlon_transform 
        kwargs:
          raw_lat_field: <<raw_lat_field>>
          raw_lat_hemi_field: <<raw_lat_hemi_field>>
          raw_lon_field: <<raw_lon_field>>
          raw_lon_hemi_field: <<raw_lon_hemi_field>>
          derived_lat_field: <<derived_lat_field>>
          derived_lon_field: <<derived_lon_field>>

    # Available reusable writer components
    writers:
      # Simple writers that consume structured data
      cached: &cached_writer
        class: CachedDataWriter
        kwargs:
          data_server: <<cdw_port>>
      influx: &influx_writer
        class: InfluxDBWriter
        kwargs:
          bucket_name: <<influxdb_default_bucket>>
          measurement_name: <<measurement_name>>
      influx_restricted: &influx_writer_restricted
        class: InfluxDBWriter
        kwargs:
          bucket_name: <<influxdb_restricted_bucket>>
          measurement_name: <<measurement_name>>

      # Base file writer definition (to be wrapped by the ComposedWriter)
      file: &file_writer
        class: LogfileWriter
        kwargs:
          header_file: <<header_dir>>/derived_latlon_hdr.txt
          filebase: <<file_root>>/<<cruise>>_<<logger>>
          split_char: ','
          suffix: '.txt'

      # ComposedWriter to format structured data into a string for file output
      file_from_structured: &file_from_structured
        class: ComposedWriter
        kwargs:
          transforms:
          - class: FormatTransform
            module: logger.transforms.format_transform
            kwargs:
              format_str: '{<<derived_lat_field>>},{<<derived_lon_field>>}'
          - class: TimestampTransform
            kwargs:
              sep: ','
          writers:
          - *file_writer

    # Compose logger from defined components
    configs:
      'off': {}

      # Writes structured data (derived fields) to InfluxDB and cdw
      influx:
        <<: *base
        writers:
        - *cached_writer
        - *influx_writer

      influx_restricted:
        <<: *base
        writers:
        - *cached_writer
        - *influx_writer_restricted

      # Takes structured data, formats it and writes to file
      file:
        <<: *base
        writers:
        - *file_from_structured

      # Writes to both destinations
      file+influx:
        <<: *base
        writers:
        - *cached_writer
        - *influx_writer
        - *file_from_structured