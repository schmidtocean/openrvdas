###################
config_templates:
  #################
  udp_to_file_config_template: &udp_to_file_base
    readers:
    - class: UDPReader
      kwargs:
        port: <<reader_udp_port>>
    transforms:
    - class: StripTransform
      kwargs:
        unprintable: True
    - class: TimestampTransform
      kwargs:
        sep: ','
    writers:
    - class: LogfileWriter
      kwargs:
        header_file: <<header_dir>>/<<logger>>_hdr.txt
        filebase: <<file_root>>/<<cruise>>_<<logger>>
        split_char: ','
        suffix: '.txt'

  udp_to_influx_config_template:
    <<: *udp_to_file_base
    writers:
    - class: ComposedWriter
      transforms:
      - class: PrefixTransform
        kwargs:
          prefix: <<logger>>
      - class: ParseTransform
        kwargs:
          definition_path: <<definition_path>>
      writers:
      - class: CachedDataWriter
        kwargs:
          data_server: <<cdw_port>>
      - class: InfluxDBWriter
        kwargs:
          bucket_name: <<bucket_name>>
          measurement_name: <<logger>>

  udp_to_file+influx_config_template:
    <<: *udp_to_file_base
    writers:
    - class: LogfileWriter
      kwargs:
        header_file: <<header_dir>>/<<logger>>_hdr.txt
        filebase: <<file_root>>/<<cruise>>_<<logger>>
        split_char: ','
        suffix: '.txt'
    - class: ComposedWriter
      transforms:
      - class: PrefixTransform
        kwargs:
          prefix: <<logger>>
      - class: ParseTransform
        kwargs:
          definition_path: <<definition_path>>
      writers:
      - class: CachedDataWriter
        kwargs:
          data_server: <<cdw_port>>
      - class: InfluxDBWriter
        kwargs:
          bucket_name: <<bucket_name>>
          measurement_name: <<logger>>

  udp_to_file_with_filebase_config_template:
    <<: *udp_to_file_base
    writers:
    - class: LogfileWriter
      kwargs:
        header_filebase: <<header_filebase>>
        filebase: <<filebase>>
        split_char: ','
        suffix: '.txt'

  udp_to_file+influx_with_filebase_config_template:
    <<: *udp_to_file_base
    writers:
    - class: LogfileWriter
      kwargs:
        header_filebase: <<header_filebase>>
        filebase: <<filebase>>
        split_char: ','
        suffix: '.txt'
    - class: ComposedWriter
      transforms:
      - class: PrefixTransform
        kwargs:
          prefix: <<logger>>
      - class: ParseTransform
        kwargs:
          definition_path: <<definition_path>>
      writers:
      - class: CachedDataWriter
        kwargs:
          data_server: <<cdw_port>>
      - class: InfluxDBWriter
        kwargs:
          bucket_name: <<bucket_name>>
          measurement_name: <<logger>>

