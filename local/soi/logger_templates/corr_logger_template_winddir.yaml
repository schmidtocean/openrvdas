# ---------------------------------------------------------------------------
# Template: corr_logger_template_winddir
#
# Description:
#   Defines a logger that utilises WindDirCorrectionTransform to perform a
#   zero-line orientation correction to a wind direction sensor.
#   It reads a specified raw field, applies the transform, and writes data to
#   db and or file.
#
# Required Logger Variables:
#   - wind_dir_field:      (string) raw wind direction data field
#   - apparent_dir_name:   (string) name for the new corrected data field
#   - zero_line_reference: (number) orientation offset in degrees (e.g., 180)
#   - measurement_name:    (string) measurement name for InfluxDB writers
#
# ---------------------------------------------------------------------------
logger_templates:
  corr_logger_template_winddir:

    # Common base defining the core read/transform logic
    common_base: &common_base
      readers:
      - class: CachedDataReader
        kwargs:
          data_server: <<cdw_port>>
          subscription:
            fields:
              <<wind_dir_field>>:
                seconds: 0
      transforms:
      - class: WindDirCorrectionTransform
        module: contrib.soi.logger.transforms.winddircorrection_transform
        kwargs:
          wind_dir_field: <<wind_dir_field>>
          apparent_dir_name: <<apparent_dir_name>>
          zero_line_reference: <<zero_line_reference>>

    # Available reusable writer components
    component_writers:
      cached: &cached_writer
        class: CachedDataWriter
        kwargs:
          data_server: <<cdw_port>>
      influx: &influx_writer
        class: InfluxDBWriter
        kwargs:
          bucket_name: <<influxdb_default_bucket>>
          measurement_name: <<measurement_name>>
      influx_restricted: &influx_writer_restricted
        class: InfluxDBWriter
        kwargs:
          bucket_name: <<influxdb_restricted_bucket>>
          measurement_name: <<measurement_name>>
      file: &file_writer
        class: LogfileWriter
        kwargs:
          header_file: <<header_dir>>/<<logger>>_hdr.txt
          filebase: <<file_root>>/<<cruise>>_<<logger>>
          split_char: ','
          suffix: '.txt'

    # Add writers to base config
    configs:
      'off': {}

      influx:
        <<: *common_base
        writers:
        - *cached_writer
        - *influx_writer

      influx_restricted:
        <<: *common_base
        writers:
        - *cached_writer
        - *influx_writer_restricted

      file:
        <<: *common_base
        writers:
        - *file_writer

      file+influx:
        <<: *common_base
        writers:
        - *cached_writer
        - *influx_writer
        - *file_writer