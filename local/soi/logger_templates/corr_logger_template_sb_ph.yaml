# ---------------------------------------------------------------------------
# Template: corr_logger_template_sb_ph
#
# Description:
#   Defines a logger that utilises AMTPHTransform to apply temperature
#   compensation to an AMT Deep Sea pH sensor. It reads a raw pH voltage
#   field and a temperature field, applies the Nernst-based correction
#   using provided calibration constants, then outputs structured
#   data for databases and uses a ComposedWriter to apply formatting
#   for text file output.
#
#   Calibration coefficients (a0 and a1_20c) can be passed explicitly via
#   logger variables. If not provided, they will be loaded from YAML files 
#   in the local/soi/slopes/ directory based on the voltage_field name.
#
# Required Logger Variables:
#   - voltage_field:       (string) The raw pH voltage field to read
#   - temp_field:          (string) The seawater temperature field to read
#   - output_field:        (string) The name for the new corrected pH field
#   - measurement_name:    (string) The measurement name for InfluxDB writers
#
#  Logger Variables:
#   - cal_a0:              (float)  Calibration coefficient a0
#   - cal_a1_20c:          (float)  Calibration coefficient a1_20c (20C)
#   - header_file:         (string) Override header file path for file output
#   - filebase:            (string) Override file base path for file output
#
# ---------------------------------------------------------------------------
logger_templates:
  corr_logger_template_sb_ph:

    # Common base defining the core read/transform logic
    # Output is always structured data
    base: &base
      readers:
      - class: CachedDataReader
        kwargs:
          data_server: <<cdw_port>>
          subscription:
            fields:
              <<voltage_field>>:
                seconds: 0
              <<temp_field>>:
                seconds: 0
      transforms:
      - class: AMTPhTransform
        module: contrib.soi.logger.transforms.amt_ph_transform
        kwargs:
          output_field: <<output_field>>
          voltage_field: <<voltage_field>>
          temp_field: <<temp_field>>
          a0: <<cal_a0>>
          a1_20c: <<cal_a1_20c>>
          update_on_fields: <<voltage_field>>
          max_field_age:
            <<temp_field>>: 5
            <<voltage_field>>: 2

    # Available reusable writer components
    writers:
      # Simple writers that consume structured data
      cached: &cached_writer
        class: CachedDataWriter
        kwargs:
          data_server: <<cdw_port>>
      influx: &influx_writer
        class: InfluxDBWriter
        kwargs:
          bucket_name: <<influxdb_default_bucket>>
          measurement_name: <<measurement_name>>
      influx_restricted: &influx_writer_restricted
        class: InfluxDBWriter
        kwargs:
          bucket_name: <<influxdb_restricted_bucket>>
          measurement_name: <<measurement_name>>

      # Base file writer definition (to be wrapped by the ComposedWriter)
      file: &file_writer
        class: LogfileWriter
        kwargs:
          header_file: <<header_file|<<header_dir>>/<<logger>>_hdr.txt>>
          filebase: <<filebase|<<file_root>>/<<cruise>>_<<measurement_name>>_corr>>
          split_char: ','
          suffix: '.txt'

      # ComposedWriter to format structured data into a string for file output
      file_from_structured: &file_from_structured
        class: ComposedWriter
        kwargs:
          transforms:
          - class: FormatTransform
            module: logger.transforms.format_transform
            kwargs:
              format_str: '{<<output_field>>}'
          - class: TimestampTransform
            kwargs:
              sep: ','
          writers:
          - *file_writer # Uses the base file writer component

    # Compose logger from defined components
    configs:
      'off': {}

      # Writes structured data directly to InfluxDB and cdw
      influx:
        <<: *base
        writers:
        - *cached_writer
        - *influx_writer

      influx_restricted:
        <<: *base
        writers:
        - *cached_writer
        - *influx_writer_restricted

      # Takes structured data, formats it and writes to file
      file:
        <<: *base
        writers:
        - *file_from_structured

      # Writes to both destinations applying formatting only for the file
      file+influx:
        <<: *base
        writers:
        - *cached_writer
        - *influx_writer
        - *file_from_structured