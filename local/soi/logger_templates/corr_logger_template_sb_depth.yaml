# ---------------------------------------------------------------------------
# Template: corr_logger_template_sb_depth
#
# Description:
#   Defines a logger that utilises DepthCorrectionTransform to perform a
#   pressure-to-depth correction. It reads specified raw fields, applies
#   the transform, then outputs structured data for cdw and influx then utilises
#   ComposedWriter to apply formatting for text file output.
#
# Required Logger Variables:
#   - device:                     (string) The device name (e.g., SB_CTD_SBE49)
#   - device_pressure_field_name: (string) The raw pressure data field to correct
#   - conv_coefficient:           (number) The coefficient for pressure conversion
#   - device_pressure_abs:        (bool)   Whether the pressure is absolute
#   - measurement_name:           (string) The measurement name for InfluxDB writers
#
# ---------------------------------------------------------------------------
logger_templates:
  corr_logger_template_sb_depth:

    # Common base defining the core read/transform logic
    # Its output is always structured data.
    base: &base
      readers:
      - class: CachedDataReader
        kwargs:
          data_server: <<cdw_port>>
          subscription:
            fields:
              <<device_pressure_field_name>>:
                seconds: 0
              Seapath_Latitude:
                seconds: 0
              Seapath_FixQuality:
                seconds: 0
      transforms:
      - class: DepthCorrectionTransform
        module: contrib.soi.logger.transforms.depthcorrection_transform
        kwargs:
          latitude_field: Seapath_Latitude
          position_status_field: Seapath_FixQuality
          pressure_field: <<device_pressure_field_name>>
          conv_coefficient: <<conv_coefficient>>
          pressure_abs: <<device_pressure_abs>>
          corr_depth_name: <<device>>_Depth_Corr
          update_on_fields:
          - <<device_pressure_field_name>>
          max_field_age:
            Seapath_Latitude: 600

    # Available reusable writer components
    writers: &writers
      # Simple writers that consume structured data
      cached: &cached_writer
        class: CachedDataWriter
        kwargs:
          data_server: <<cdw_port>>
      influx: &influx_writer
        class: InfluxDBWriter
        kwargs:
          bucket_name: <<influxdb_default_bucket>>
          measurement_name: <<measurement_name>>
      influx_restricted: &influx_writer_restricted
        class: InfluxDBWriter
        kwargs:
          bucket_name: <<influxdb_restricted_bucket>>
          measurement_name: <<measurement_name>>

      # Base file writer definition (to be wrapped by the ComposedWriter)
      file: &file_writer
        class: LogfileWriter
        kwargs:
          header_file: <<header_dir>>/depth_corrected_hdr.txt
          filebase: <<file_root>>/<<cruise>>_<<measurement_name>>_depth_corr
          split_char: ','
          suffix: '.txt'

      # ComposedWriter to format structured data into a string for file output
      file_from_structured: &file_from_structured
        class: ComposedWriter
        kwargs:
          transforms:
          - class: FormatTransform
            module: logger.transforms.format_transform
            kwargs:
              format_str: '{<<device>>_Depth_Corr}'
          - class: TimestampTransform
            kwargs:
              sep: ','
          writers:
          - *file_writer # Uses the base file writer component

    # Compose logger from defined components
    configs:
      'off': {}

      # Writes structured data directly to InfluxDB and cdw
      influx:
        <<: *base
        writers:
        - *cached_writer
        - *influx_writer

      influx_restricted:
        <<: *base
        writers:
        - *cached_writer
        - *influx_writer_restricted

      # Takes structured data, formats it and writes to file
      file:
        <<: *base
        writers:
        - *file_from_structured

      # Writes to both destinations applying formatting only for the file
      file+influx:
        <<: *base
        writers:
        - *cached_writer
        - *influx_writer
        - *file_from_structured