###################
logger_templates:
  #################
  corr_logger_template_sb_depth:
    configs:
      'off': {}
      influx:
        readers:
        - class: CachedDataReader
          kwargs:
            data_server: <<cdw_port>>
            subscription:
              fields:
                <<device_pressure_field_name>>:
                  seconds: 0
                Seapath_Latitude:
                  seconds: 0
                Seapath_FixQuality:
                  seconds: 0
        transforms:
        - class: DepthCorrectionTransform
          module: contrib.soi.logger.transforms.depthcorrection_transform
          kwargs:
            latitude_field: Seapath_Latitude
            position_status_field: Seapath_FixQuality
            pressure_field: <<device_pressure_field_name>>
            conv_coefficient: <<conv_coefficient>>
            pressure_abs: <<device_pressure_abs>
            corr_depth_name: <<device>>_Depth_Corr
            update_on_fields:
            - <<device_pressure_field_name>>
            max_field_age:
              Seapath_Latitude: 600
        writers:
        - class: CachedDataWriter
          kwargs:
            data_server: <<cdw_port>>
        - class: InfluxDBWriter
          kwargs:
            bucket_name: <<influxdb_default_bucket>>
            measurement_name: <<measurement_name>>
      influx_restricted:
        readers:
        - class: CachedDataReader
          kwargs:
            data_server: <<cdw_port>>
            subscription:
              fields:
                <<device_pressure_field_name>>:
                  seconds: 0
                Seapath_Latitude:
                  seconds: 0
                Seapath_FixQuality:
                  seconds: 0
        transforms:
        - class: DepthCorrectionTransform
          module: contrib.soi.logger.transforms.depthcorrection_transform
          kwargs:
            latitude_field: Seapath_Latitude
            position_status_field: Seapath_FixQuality
            pressure_field: <<device_pressure_field_name>>
            conv_coefficient: <<conv_coefficient>>
            pressure_abs: <<device_pressure_abs>
            corr_depth_name: <<device>>_Depth_Corr
            update_on_fields:
            - <<device_pressure_field_name>>
            max_field_age:
              Seapath_Latitude: 600
        writers:
        - class: CachedDataWriter
          kwargs:
            data_server: <<cdw_port>>
        - class: InfluxDBWriter
          kwargs:
            bucket_name: <<influxdb_restricted_bucket>>
            measurement_name: <<measurement_name>>
      file:
        readers:
        - class: CachedDataReader
          kwargs:
            data_server: <<cdw_port>>
            subscription:
              fields:
                <<device_pressure_field_name>>:
                  seconds: 0
                Seapath_Latitude:
                  seconds: 0
                Seapath_FixQuality:
                  seconds: 0
        transforms:
        - class: DepthCorrectionTransform
          module: contrib.soi.logger.transforms.depthcorrection_transform
          kwargs:
            latitude_field: Seapath_Latitude
            position_status_field: Seapath_FixQuality
            pressure_field: <<device_pressure_field_name>>
            conv_coefficient: <<conv_coefficient>>
            pressure_abs: <<device_pressure_abs>
            corr_depth_name: <<device>>_Depth_Corr
            update_on_fields:
            - <<device_pressure_field_name>>
            max_field_age:
              Seapath_Latitude: 600
        - class: FormatTransform
          module: logger.transforms.format_transform
          kwargs:
            format_str: '{<<device>>_Depth_Corr}'
        - class: TimestampTransform
          kwargs:
            sep: ','
        writers:
        - class: LogfileWriter
          kwargs:
            header_file: <<header_dir>>/depth_corrected_hdr.txt
            filebase: <<file_root>>/<<cruise>>_<<measurement_name>>_depth_corr
            split_char: ','
            suffix: '.txt'
      file+influx:
        readers:
        - class: CachedDataReader
          kwargs:
            data_server: <<cdw_port>>
            subscription:
              fields:
                <<device_pressure_field_name>>:
                  seconds: 0
                Seapath_Latitude:
                  seconds: 0
                Seapath_FixQuality:
                  seconds: 0
        transforms:
        - class: DepthCorrectionTransform
          module: contrib.soi.logger.transforms.depthcorrection_transform
          kwargs:
            latitude_field: Seapath_Latitude
            position_status_field: Seapath_FixQuality
            pressure_field: <<device_pressure_field_name>>
            conv_coefficient: <<conv_coefficient>>
            pressure_abs: <<device_pressure_abs>
            corr_depth_name: <<device>>_Depth_Corr
            update_on_fields:
            - <<device_pressure_field_name>>
            max_field_age:
              Seapath_Latitude: 600
        - class: InfluxDBWriter
          kwargs:
            bucket_name: <<influxdb_default_bucket>>
            measurement_name: <<measurement_name>>
        - class: FormatTransform
          module: logger.transforms.format_transform
          kwargs:
            format_str: '{<<device>>_Depth_Corr}'
        - class: TimestampTransform
          kwargs:
            sep: ','
        writers:
        - class: LogfileWriter
          kwargs:
            header_file: <<header_dir>>/depth_corrected_hdr.txt
            filebase: <<file_root>>/<<cruise>>_<<measurement_name>>_depth_corr
            split_char: ','
            suffix: '.txt'