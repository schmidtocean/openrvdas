###################
logger_templates:
  #################
  corr_logger_template_sb_depth:
    configs:
      'off': {}
      influx:
        readers:
        - class: CachedDataReader
          kwargs:
            data_server: <<cdw_port>>
            subscription:
              fields:
                <<device_pressure_field_name>>:
                  seconds: 0
                SB_Sprint_Latitude:
                  seconds: 0
        transforms:
        - class: DepthCorrectionTransform
          module: contrib.soi.logger.transforms.depthcorrection_transform
          kwargs:
            latitude_field: SB_Sprint_Latitude
            pressure_field: <<device_pressure_field_name>>
            pressure_abs: <<device_pressure_abs>
            corr_depth_name: <<device>>_Depth_Corr
            update_on_fields:
            - <<device_pressure_field_name>>
            max_field_age:
              SB_Sprint_Latitude: 600
        writers:
        - class: CachedDataWriter
          kwargs:
            data_server: <<cdw_port>>
        - class: InfluxDBWriter
          kwargs:
            bucket_name: <<influxdb_default_bucket>>
            measurement_name: <<device>> # mesurement name needs to be lowercase
      influx_restricted:
        readers:
        - class: CachedDataReader
          kwargs:
            data_server: <<cdw_port>>
            subscription:
              fields:
                <<device_pressure_field_name>>:
                  seconds: 0
                SB_Sprint_Latitude:
                  seconds: 0
        transforms:
        - class: DepthCorrectionTransform
          module: contrib.soi.logger.transforms.depthcorrection_transform
          kwargs:
            latitude_field: SB_Sprint_Latitude
            pressure_field: <<device_pressure_field_name>>
            pressure_abs: <<device_pressure_abs>
            corr_depth_name: <<device>>_Depth_Corr
            update_on_fields:
            - <<device_pressure_field_name>>
            max_field_age:
              SB_Sprint_Latitude: 600
        writers:
        - class: CachedDataWriter
          kwargs:
            data_server: <<cdw_port>>
        - class: InfluxDBWriter
          kwargs:
            bucket_name: <<influxdb_restricted_bucket>>
            measurement_name: <<measurement_name>> # needs to be lowercase
      file:
        readers:
        - class: CachedDataReader
          kwargs:
            data_server: <<cdw_port>>
            subscription:
              fields:
                <<device_pressure_field_name>>:
                  seconds: 0
                SB_Sprint_Latitude:
                  seconds: 0
        transforms:
        - class: DepthCorrectionTransform
          module: contrib.soi.logger.transforms.depthcorrection_transform
          kwargs:
            latitude_field: SB_Sprint_Latitude
            pressure_field: <<device_pressure_field_name>>
            pressure_abs: <<device_pressure_abs>
            corr_depth_name: <<device>>_Depth_Corr
            update_on_fields:
            - <<device_pressure_field_name>>
            max_field_age:
              SB_Sprint_Latitude: 600
        - class: FormatTransform
          module: logger.transforms.format_transform
          kwargs:
            format_str: <<device>>_Depth_Corr # device name needs to be uppercase
        - class: TimestampTransform
          kwargs:
            sep: ','
        writers:
        - class: LogfileWriter
          kwargs:
            header_file: <<header_dir>>/depth_corrected_hdr.txt
            filebase: <<file_root>>/<<cruise>>_<<measurement_name>>_corr
            split_char: ','
            suffix: '.txt'