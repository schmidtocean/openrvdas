###################
config_templates:
  #################
  density_corr_to_file_config_template: &density_corr_to_file_config_template_base
    readers:
    - class: CachedDataReader
      kwargs:
        data_server: <<cdw_port>>
        subscription:
          fields:
            <<salinity_field>>:
              seconds: 0
            <<temperature_field>>:
              seconds: 0
            <<pressure_field>>:
              seconds: 0
            <<latitude_field>>:
              seconds: 0
            <<longitude_field>>:
              seconds: 0
            <<position_status_field>>:
              seconds: 0
    transforms:
    - class: DensityCorrectionTransform
      module: contrib.soi.logger.transforms.densitycorrection_transform
      kwargs:
        corr_density_name: <<device>>_Density_Corr
        latitude_field: <<latitude_field>>
        longitude_field: <<latitude_field>>
        position_status_field: <<position_status_field>>
        pressure_coefficient: <<pressure_coefficient>>
        pressure_field: <<pressure_field>>
        salinity_coefficient: <<salinity_coefficient>>
        salinity_field: <<salinity_field>>
        temperature_coefficient: <<temperature_coefficient>>
        temperature_field: <<temperature_field>>
        update_on_fields:
        - <<salinity_field>>
        - <<temperature_field>>
        - <<pressure_field>>
        max_field_age:
          <<latitude_field>>: 600
    writers:
    - class: ComposedWriter
      transforms:
      - class: FormatTransform
        module: logger.transforms.format_transform
        kwargs:
          format_str: <<device>>_Density_Corr # device name needs to be uppercase
      - class: TimestampTransform
        kwargs:
          sep: ','
      writers:
      - class: LogfileWriter
        kwargs:
          header: "timestamp,density_kg/m^3"
          filebase: <<file_root>>/<<cruise>>_<<logger>>
          split_char: ','
          suffix: '.txt'

  density_corr_to_influx_config_template:
    <<: *density_corr_to_file_config_template_base
    writers:
    - class: CachedDataWriter
      kwargs:
        data_server: <<cdw_port>>
    - class: InfluxDBWriter
      kwargs:
        bucket_name: <<bucket_name>>
        measurement_name: <<measurement_name>>

  density_corr_to_file+influx_config_template:
    <<: *density_corr_to_file_config_template_base
    writers:
    - class: CachedDataWriter
      kwargs:
        data_server: <<cdw_port>>
    - class: InfluxDBWriter
      kwargs:
        bucket_name: <<bucket_name>>
        measurement_name: <<measurement_name>>
    - class: ComposedWriter
      transforms:
      - class: FormatTransform
        module: logger.transforms.format_transform
        kwargs:
          format_str: <<device>>_Density_Corr # device name needs to be uppercase
      - class: TimestampTransform
        kwargs:
          sep: ','
      writers:
      - class: LogfileWriter
        kwargs:
          header: "timestamp,density_kg/m^3"
          filebase: <<file_root>>/<<cruise>>_<<logger>>
          split_char: ','
          suffix: '.txt'

###################
logger_templates:
  #################
  corr_density_logger_template:
    configs:
      'off': {}
      influx:
        config_template: density_corr_to_influx_config_template
        variables:
          bucket_name: <<influxdb_default_bucket>>
          device: <<device>>
          latitude_field: <<latitude_field>>
          longitude_field: <<longitude_field>>
          measurement_name: <<measurement_name>>
          position_status_field: <<position_status_field>>
          pressure_coefficient: <<conv_coefficient>>
          pressure_field: <<pressure_field>>
          salinity_coefficient: <<salinity_coefficient>>
          salinity_field: <<salinity_field>>
          temperature_coefficient: <<temperature_coefficient>>
          temperature_field: <<temperature_field>>
      influx_restricted:
        config_template: density_corr_to_influx_config_template
        variables:
          bucket_name: <<influxdb_restricted_bucket>>
          device: <<device>>
          latitude_field: <<latitude_field>>
          longitude_field: <<longitude_field>>
          measurement_name: <<measurement_name>>
          position_status_field: <<position_status_field>>
          pressure_coefficient: <<conv_coefficient>>
          pressure_field: <<pressure_field>>
          salinity_coefficient: <<salinity_coefficient>>
          salinity_field: <<salinity_field>>
          temperature_coefficient: <<temperature_coefficient>>
          temperature_field: <<temperature_field>>
      file:
        config_template: density_corr_to_file_config_template
        variables:
          device: <<device>>
          latitude_field: <<latitude_field>>
          longitude_field: <<longitude_field>>
          measurement_name: <<measurement_name>>
          position_status_field: <<position_status_field>>
          pressure_coefficient: <<conv_coefficient>>
          pressure_field: <<pressure_field>>
          salinity_coefficient: <<salinity_coefficient>>
          salinity_field: <<salinity_field>>
          temperature_coefficient: <<temperature_coefficient>>
          temperature_field: <<temperature_field>>
      file+influx:
        config_template: density_corr_to_file+influx_config_template
        variables:
          bucket_name: <<influxdb_default_bucket>>
          device: <<device>>
          latitude_field: <<latitude_field>>
          longitude_field: <<longitude_field>>
          measurement_name: <<measurement_name>>
          position_status_field: <<position_status_field>>
          pressure_coefficient: <<conv_coefficient>>
          pressure_field: <<pressure_field>>
          salinity_coefficient: <<salinity_coefficient>>
          salinity_field: <<salinity_field>>
          temperature_coefficient: <<temperature_coefficient>>
          temperature_field: <<temperature_field>>
