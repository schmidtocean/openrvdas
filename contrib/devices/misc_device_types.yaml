################################################################################
# Miscellaneous Device Type Definitions
#
# See README.md in this directory

######################################
ADCP_OS75:
  category: "device_type"
  description: "RD Industries OS-75 Acoustic Doppler Current Profiler"
  
  format:
    PUHAW: "$PUHAW,UVH,{VelocityE:f},{VelocityN:f},{HeadingT:f}"
    VDVBW: "$VDVBW,{LongWaterSpeed:f},{TransWaterSpeed:f},{WaterSpeedStatus:ow},{LongGroundSpeed:of},{TransGroundSpeed:of},{GroundSpeedStatus:ow}*{Checksum:x}"

  fields:
    VelocityE:
      units: ""
      description: "Current velocity to (relative) east"
    VelocityN:
      units: ""
      description: "Current velocity to (relative) north"
    HeadingT:
      units: "degrees"
      description: "True Heading"
    LongWaterSpeed:
      units: "knots"
      description: "Longitudinal water speed (negative means astern)"
    TransWaterSpeed:
      units: "knots"
      description: "Longitudinal water speed (negative means port)"
    WaterSpeedStatus:
      description: "A = Data Valid"
    LongGroundSpeed:
      units: "knots"
      description: "Longitudinal ground speed (negative means astern)"
    TransGroundSpeed:
      units: "knots"
      description: "Transverse ground speed (negative means port)"
    GroundSpeedStatus:
      description: "A = Data Valid"

######################################
Gravimeter_BGM3:
  category: "device_type"
  description: "Bell Aerospace BGM-3"

  format: "{CounterUnits:d}:{GravityValue:d} {GravityError:d}"

  fields:
    CounterUnits:
      description: "apparently a constant 01"
    GravityValue:
      units: "Flit Count"
      description: "mgal = flit count x 4.994072552 + bias"
    GravityError:
      description: "unknown semantics"

######################################
Gyrocompass:
  category: "device_type"
  description: "Gyrocompass"

  format:
    HEHDT: "$HEHDT,{HeadingTrue:g},T*{Checksum:x}"
    HEROT: "$HEROT,{RateOfTurn:g},A*{Checksum:x}"

  fields:
    HeadingTrue:
      units: "degrees"
      description: "True heading"
    RateOfTurn:
      units: "degrees/min"
      description: "Rate of turn"

######################################
MultibeamEM122:
  category: "device_type"
  description: "Simrad EM122 Multibeam"

  format: "$KIDPT,{Depth:g},{WaterlineDist:g},{MaxRange:g}*{Checksum:x}"

  fields:
    Depth:
      units: "m"
      description: "Depth at transducer"
    WaterlineDist:
      units: "m"
      description: "Distance to waterline from transducer"
    MaxRange:
      units: "m"
      description: "Maximum range in use"

######################################
PCO2_LDEO:
  category: "device_type"
  description: "LDEO pCO2 Equilibration System"

  # 2015056.60236  2608.36  30.14  977.91  48.25  368.76  353.92  -1.18  -1.26  0.00  Equil
  # 2014213.00116  2733.40  41.52  1022.65  56.29  388.56 382.41  21.83  21.94   0.00  Equil
  format: "{TimeTag:f}{:s}{Voltage:g}{:s}{CellTemp:g}{:s}{EquilPressure:g}{:s}{FlowRate:g}{:s}{PCO2Pressure:g}{:s}{VCO2Concentration:g}{:s}{EquilTempRTD:g}{:s}{EquilTempSBE38:g}{:s}{ValvePosition:g}{:s}{Source:w}"

  fields:
    TimeTag:
      units: "UTC"
      description: "yyyyddd.ttt - where ttt is frational time of day"
    Voltage:
      units: "mV"
      description: "Raw Voltage"
    CellTemp:
      units: "C"
      description: "Cell temperature"
    EquilPressure:
      units: "mBar"
      description: "Equilibration pressure"
    FlowRate:
      units: "cm3/min"
      description: "Flow rate"
    PCO2Pressure:
      units: "uAtm"
      description: "pCO2 pressure"
    VCO2Concentration:
      units: "ppm"
      description: "VCO2 concentration"
    EquilTempRTD:
      units: "C"
      description: "Equilibrator Temperature, RTD"
    EquilTempSBE38:
      units: "C"
      description: "Equilibrator Temperature, SBE38"
    ValvePosition:
      units: ""
      description: "Longitude in degrees west"
    Source:
      units: ""
      description: "Source of flow; Equil = pCO2 measurement"


######################################
PCO2_GO8050:
  category: "device_type"
  description: "General Oceanics Model 8050 pCO2"

  # $PPCO2,STD3,0,31/01/26,01:30:10,2026-01-31T01:30:09Z,-41.3044,-46.2995,430.20,16.56,2375.70,428.38,10.46,0.06,35.23,1024.80,1022.00,2.95,80.58,74.00,1.46,9.89,9.89,9.89,0.00,5.00,22.69, 17.6100,  34.5549,76.7,2.4,1021.184,16.26*67
  # Used :nc to avoid parsin vars like LatLon that are already part of GNSS data
  format:
    STD: "$PPCO2,STD{StdNum:d}{StdSuffix:ow},{Std_Error:od},{:nc},{:nc},{:ti},{:og},{:og},{Std_StdValue:og},{Std_EquTemp:og},{Std_CO2Raw:og},{Std_CO2Cal:og},{Std_H2ORaw:og},{Std_H2OCal:og},{Std_CellTemp:og},{Std_CellPres:og},{Std_AtmPres:og},{Std_EquPres:og},{Std_LicorFlow:og},{Std_PumpSpeed:og},{Std_VentFlow:og},{Std_CondATM:og},{Std_CondEQU:og},{Std_Drip1:og},{Std_Drip2:og},{Std_CondTemp:og},{Std_BoxTemp:og},{Std_TSGTemp:og},{Std_TSGSal:og},{Std_Aux1:og},{Std_WaterFlow:og},{Std_Aux2:og},{Std_Aux3:og}*{Checksum:x}"
    STD4_DRAIN: "$PPCO2,STD4-DRAIN,{Std_Error:od},{:nc},{:nc},{:ti},{:og},{:og},{Std_StdValue:og},{Std_EquTemp:og},{Std_CO2Raw:og},{Std_CO2Cal:og},{Std_H2ORaw:og},{Std_H2OCal:og},{Std_CellTemp:og},{Std_CellPres:og},{Std_AtmPres:og},{Std_EquPres:og},{Std_LicorFlow:og},{Std_PumpSpeed:og},{Std_VentFlow:og},{Std_CondATM:og},{Std_CondEQU:og},{Std_Drip1:og},{Std_Drip2:og},{Std_CondTemp:og},{Std_BoxTemp:og},{Std_TSGTemp:og},{Std_TSGSal:og},{Std_Aux1:og},{Std_WaterFlow:og},{Std_Aux2:og},{Std_Aux3:og}*{Checksum:x}"
    ATM: "$PPCO2,ATM,{Atm_Error:od},{:nc},{:nc},{:ti},{:og},{:og},{Atm_StdValue:nc},{Atm_EquTemp:og},{Atm_CO2Raw:og},{Atm_CO2Cal:og},{Atm_H2ORaw:og},{Atm_H2OCal:og},{Atm_CellTemp:og},{Atm_CellPres:og},{Atm_AtmPres:og},{Atm_EquPres:og},{Atm_LicorFlow:og},{Atm_PumpSpeed:og},{Atm_VentFlow:og},{Atm_CondATM:og},{Atm_CondEQU:og},{Atm_Drip1:og},{Atm_Drip2:og},{Atm_CondTemp:og},{Atm_BoxTemp:og},{Atm_TSGTemp:og},{Atm_TSGSal:og},{Atm_Aux1:og},{Atm_WaterFlow:og},{Atm_Aux2:og},{Atm_Aux3:og}*{Checksum:x}"
    EQU: "$PPCO2,EQU,{Equ_Error:od},{:nc},{:nc},{:ti},{:og},{:og},{Equ_StdValue:nc},{Equ_EquTemp:og},{Equ_CO2Raw:og},{Equ_CO2Cal:og},{Equ_H2ORaw:og},{Equ_H2OCal:og},{Equ_CellTemp:og},{Equ_CellPres:og},{Equ_AtmPres:og},{Equ_EquPres:og},{Equ_LicorFlow:og},{Equ_PumpSpeed:og},{Equ_VentFlow:og},{Equ_CondATM:og},{Equ_CondEQU:og},{Equ_Drip1:og},{Equ_Drip2:og},{Equ_CondTemp:og},{Equ_BoxTemp:og},{Equ_TSGTemp:og},{Equ_TSGSal:og},{Equ_Aux1:og},{Equ_WaterFlow:og},{Equ_Aux2:og},{Equ_Aux3:og}*{Checksum:x}"
    EQU_DRAIN: "$PPCO2,EQU-DRAIN,{Equ_Error:od},{:nc},{:nc},{:ti},{:og},{:og},{Equ_StdValue:nc},{Equ_EquTemp:og},{Equ_CO2Raw:og},{Equ_CO2Cal:og},{Equ_H2ORaw:og},{Equ_H2OCal:og},{Equ_CellTemp:og},{Equ_CellPres:og},{Equ_AtmPres:og},{Equ_EquPres:og},{Equ_LicorFlow:og},{Equ_PumpSpeed:og},{Equ_VentFlow:og},{Equ_CondATM:og},{Equ_CondEQU:og},{Equ_Drip1:og},{Equ_Drip2:og},{Equ_CondTemp:og},{Equ_BoxTemp:og},{Equ_TSGTemp:og},{Equ_TSGSal:og},{Equ_Aux1:og},{Equ_WaterFlow:og},{Equ_Aux2:og},{Equ_Aux3:og}*{Checksum:x}"


  fields:
    StdNum:
      units: ""
      description: "STD run number (e.g. 3 for STD3 or 4 for STD4-DRAIN)"
    StdSuffix:
      units: ""
      description: "STD run suffix (for example s/z or -DRAIN)"
    Std_Error:
      units: ""
      description: "STD run: Instrument error code"
    Std_StdValue:
      units: "umol/mol"
